[project]
name = "menodax"
version = "0.0.3"
description = "GPU-accelerated ODE solvers for massive ensembles of low-dimensional trajectories"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Lawrence Berry", email = "lawrenceberry@outlook.com" }]
# PEP 639: an SPDX expression and the files themselves, rather than the old
# free-text field and License classifier. Needs the setuptools pinned below.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
# Only what `menodax/` itself needs. The Diffrax and BlackJAX baselines the
# examples compare against, and the matplotlib their figures use, moved to the
# dev group: nothing here solves an ODE without them, and PyPI rejects a
# distribution whose metadata carries a direct URL dependency, which the
# BlackJAX fork is.
dependencies = [
    "jax>=0.9.1",
    # numba itself is still needed: numba-enzyme builds on it. numba-cuda is
    # not -- it came in only through nvmath's numba extra, and numba-cuda-mlir
    # vendors its own numba_cuda rather than depending on that package.
    "numba>=0.61",
    "numba-cuda-mlir[cu13]>=0.5.1",
    # Supplies the Enzyme-derived Jacobians used by the implicit solvers. The
    # CUDA-enabled fork of numba-enzyme, published under its own name because
    # upstream's release has no CUDA backend; it vendors the LLVM 15 + Enzyme
    # toolchain the derivative pipeline shells out to and provides the
    # `numba_enzyme` import package, so upstream must not be installed
    # alongside it (see wheels/README.md).
    "numba-enzyme-cuda>=0.2.1",
    # Colours the Jacobian's column-intersection graph, so a sparsity pattern
    # turns into the few compressed Enzyme sweeps that recover it.
    "networkx>=3.4",
    "numpy>=2.4.3",
    # SuiteSparse's AMD, which orders a sparsity pattern for the compiled
    # sparse direct solver (menodax/_sparse_direct.py). cvxopt ships it in a
    # manylinux wheel; scikit-sparse, which used to supply it, has none and
    # compiles against SuiteSparse's headers that `pip install` cannot put on
    # the machine.
    "cvxopt>=1.3",
    "scipy>=1.17.1",
]

[project.urls]
Documentation = "https://lawrenceberry.github.io/menodax/"
Source = "https://github.com/lawrenceberry/menodax"
Issues = "https://github.com/lawrenceberry/menodax/issues"

[project.optional-dependencies]
# scikit-sparse lived here, and before that in the dependencies. Nothing needs
# it now: cvxopt's wheel carries the AMD, and CHOLMOD's other orderings were
# measured to be AMD's own fill or worse. The name stays so that `menodax[sparse]`
# in a consumer's pyproject keeps resolving.
sparse = []

cuda12 = [
    "jax[cuda12]>=0.9.1",
]
cuda13 = [
    "jax[cuda13]>=0.9.1",
]

[dependency-groups]
# The docs build reads the package with griffe, which parses the source rather
# than importing it, so `uv sync --only-group docs` is all the site needs -- no
# CUDA toolchain, no SuiteSparse, no GPU.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    # mkdocstrings formats the signatures it renders with it.
    "ruff>=0.15.5",
]
dev = [
    # The example baselines and their plotting, not runtime dependencies of the
    # solvers. `uv sync` installs this group by default, so the examples run as
    # they always did.
    "blackjax @ git+https://github.com/handley-lab/blackjax@nested_sampling",
    "diffrax>=0.7.2",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
    "pytest-regressions>=2.10.0",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
addopts = "-m 'not slow'"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["menodax*"]
exclude = ["reference*", "tests*"]

[tool.ruff.lint]
# On top of the default `select`, enable imports sorting
extend-select = ["I"]

[tool.pyright]
typeCheckingMode = "recommended"
venv = ".venv"
venvPath = "."
