[project]
name = "menodax"
version = "0.0.1"
description = "GPU-accelerated ODE solvers for massive ensembles of low-dimensional trajectories"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Lawrence Berry", email = "lawrenceberry@outlook.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
# Only what `solvers/` itself needs. The Diffrax and BlackJAX baselines the
# examples compare against, and the matplotlib their figures use, moved to the
# dev group: nothing here solves an ODE without them, and PyPI rejects a
# distribution whose metadata carries a direct URL dependency, which the
# BlackJAX fork is.
dependencies = [
    "jax>=0.9.1",
    # numba itself is still needed: numba-enzyme builds on it. numba-cuda is
    # not -- it came in only through nvmath's numba extra, and numba-cuda-mlir
    # vendors its own numba_cuda rather than depending on that package.
    "numba>=0.61",
    "numba-cuda-mlir[cu13]>=0.5.1",
    # Supplies the Enzyme-derived Jacobians used by the implicit solvers. The
    # CUDA backend is not on PyPI, so this resolves to a self-contained wheel
    # released from the fork below, which vendors the LLVM 15 + Enzyme
    # toolchain the derivative pipeline shells out to (see wheels/README.md).
    "numba-enzyme[cuda]>=0.1.3",
    # Colours the Jacobian's column-intersection graph, so a sparsity pattern
    # turns into the few compressed Enzyme sweeps that recover it.
    "networkx>=3.4",
    "numpy>=2.4.3",
    # SuiteSparse's AMD, which orders a sparsity pattern for the compiled sparse
    # direct solver (solvers/_sparse_direct.py). It builds against the CHOLMOD
    # headers, so the machine needs `apt install libsuitesparse-dev` or the
    # equivalent first; `ordering="natural"` is the way round it if that is
    # not an option.
    "scikit-sparse>=0.5",
    "scipy>=1.17.1",
]

[project.urls]
Documentation = "https://lawrenceberry.github.io/modax/"
Source = "https://github.com/lawrenceberry/modax"
Issues = "https://github.com/lawrenceberry/modax/issues"

[project.optional-dependencies]
# scikit-sparse used to live behind this extra; it is a plain dependency now.
# The name stays so `menodax[sparse]` in a consumer's pyproject keeps resolving.
sparse = []

cuda12 = [
    "jax[cuda12]>=0.9.1",
]
cuda13 = [
    "jax[cuda13]>=0.9.1",
]

[tool.uv.sources]
# A release asset rather than the `cuda` branch itself: the wheel is prebuilt
# and hash-pinned in uv.lock, so `uv add menodax` downloads ~73 MB and is done,
# with no build step and no LLVM in the way. Installing from the branch
# (`{ git = "https://github.com/lawrenceberry/numba-enzyme", branch = "cuda" }`)
# is equally self-contained -- its build hook stages the same binaries out of
# the released PyPI wheel -- but pays that build on every resolve. Bump this
# URL when the fork gains a new release.
numba-enzyme = { url = "https://github.com/lawrenceberry/numba-enzyme/releases/download/v0.1.3-cuda.2/numba_enzyme-0.1.3-py3-none-linux_x86_64.whl" }

[dependency-groups]
# The docs build reads the package with griffe, which parses the source rather
# than importing it, so `uv sync --only-group docs` is all the site needs -- no
# CUDA toolchain, no SuiteSparse, no GPU.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    # mkdocstrings formats the signatures it renders with it.
    "ruff>=0.15.5",
]
dev = [
    # The example baselines and their plotting, not runtime dependencies of the
    # solvers. `uv sync` installs this group by default, so the examples run as
    # they always did.
    "blackjax @ git+https://github.com/handley-lab/blackjax@nested_sampling",
    "diffrax>=0.7.2",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
    "pytest-regressions>=2.10.0",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
addopts = "-m 'not slow'"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solvers*"]
exclude = ["reference*", "tests*"]

[tool.ruff.lint]
# On top of the default `select`, enable imports sorting
extend-select = ["I"]

[tool.pyright]
typeCheckingMode = "recommended"
venv = ".venv"
venvPath = "."
