[project]
name = "modax"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "blackjax @ git+https://github.com/handley-lab/blackjax@nested_sampling",
    "diffrax>=0.7.2",
    "jax>=0.9.1",
    "matplotlib>=3.10.8",
    "numba>=0.61",
    # numba-cuda is in maintenance mode and no longer compiles our kernels; it
    # stays because nvmath.device's shared numba extension imports numba.cuda.
    "numba-cuda>=0.10",
    "numba-cuda-mlir[cu13]>=0.5.1",
    # Supplies the Enzyme-derived Jacobians used by the implicit solvers. The
    # CUDA backend is not on PyPI, so this resolves to a self-contained wheel
    # released from the fork below, which vendors the LLVM 15 + Enzyme
    # toolchain the derivative pipeline shells out to (see wheels/README.md).
    "numba-enzyme[cuda]>=0.1.3",
    "numpy>=2.4.3",
    # 1.0.0 is the first release whose device APIs support numba-cuda-mlir
    # (nvmath/device/cusolverdx_numba_cuda_mlir.py); its "dx" extra is gone.
    "nvmath-python[cu13,cu13-dx,numba]>=1.0.0",
    "scipy>=1.17.1",
]

[tool.uv.sources]
# A release asset rather than the `cuda` branch itself: the wheel is prebuilt
# and hash-pinned in uv.lock, so `uv add modax` downloads ~73 MB and is done,
# with no build step and no LLVM in the way. Installing from the branch
# (`{ git = "https://github.com/lawrenceberry/numba-enzyme", branch = "cuda" }`)
# is equally self-contained -- its build hook stages the same binaries out of
# the released PyPI wheel -- but pays that build on every resolve. Bump this
# URL when the fork gains a new release.
numba-enzyme = { url = "https://github.com/lawrenceberry/numba-enzyme/releases/download/v0.1.3-cuda.1/numba_enzyme-0.1.3-py3-none-linux_x86_64.whl" }

[project.optional-dependencies]
cuda12 = [
    "jax[cuda12]>=0.9.1",
]
cuda13 = [
    "jax[cuda13]>=0.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
    "pytest-regressions>=2.10.0",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
addopts = "-m 'not slow'"

[tool.setuptools.packages.find]
include = ["solvers*"]
exclude = ["reference*", "tests*", "scripts*"]

[tool.ruff.lint]
# On top of the default `select`, enable imports sorting
extend-select = ["I"]

[tool.pyright]
typeCheckingMode = "recommended"
venv = ".venv"
venvPath = "."
