name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      force_badge:
        description: >
          Rewrite the coverage gist even when the percentage is unchanged.
          The action skips an identical write, so this is what proves the
          badge path works end to end after rotating GIST_TOKEN.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Most of this suite is one CUDA kernel per test, so it wants a GPU runner.
    # GitHub's GPU-enabled larger runners carry a label chosen when the runner
    # group is created, so there is no name that could be hard-coded here:
    # set the repository variable `GPU_RUNNER` to that label. Without it the
    # job falls back to an ordinary runner and skips everything that needs a
    # driver, which is nearly all of it -- what survives is the host-side work,
    # the sparsity colouring and the symbolic factorisation. That run is green
    # but says little, which is why it is not allowed to write the badge.
    runs-on: ${{ vars.GPU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Show the device
        if: vars.GPU_RUNNER != ''
        run: nvidia-smi

      - name: Install
        # The CUDA extra only where there is a device to use it: on the
        # fallback runner it would pull a few GB of nvidia wheels that nothing
        # can load. jax's own CPU build is what `uv sync` installs there, and
        # the FFI custom call is never reached.
        run: uv sync --frozen ${{ vars.GPU_RUNNER != '' && '--extra cuda13' || '' }}

      - name: Tests
        # `tests/` explicitly, not the whole tree: a bare `pytest` also
        # collects `reference/tests/`, which benchmarks modax against Julia's
        # DiffEqGPU and so wants a Julia install no runner has. `-m 'not slow'`
        # comes from `addopts` in pyproject.toml.
        run: >
          uv run --no-sync pytest tests -q
          --cov --cov-report=xml --cov-report=term-missing:skip-covered

      - name: Coverage total
        id: coverage
        run: echo "percent=$(uv run --no-sync coverage report --format=total)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        # Kept even when the suite fails, which is when the line-by-line report
        # is worth having. `pytest` writes it before it reports, unless it died
        # during collection -- hence the tolerance for it not being there.
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Update the coverage badge
        # Only from master, and only once the gist is set up: a pull request
        # from a fork gets no secrets, and the badge is meant to report the
        # state of master rather than of whatever was last proposed. A manual
        # `workflow_dispatch` on master counts, so the badge can be refreshed
        # without an empty commit -- after setting `GPU_RUNNER`, say. The gist
        # is named by the repository variable `COVERAGE_GIST_ID` and written
        # with the secret `GIST_TOKEN`, a token carrying the `gist` scope.
        #
        # Note what the number means without `GPU_RUNNER`: a fallback run
        # skips every test that needs a driver, so the badge then reports the
        # coverage of the host-side remainder rather than of the suite. It
        # rises to the real figure on the first run that has a device.
        if: >
          github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
          && vars.COVERAGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: modax-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percent }}%
          valColorRange: ${{ steps.coverage.outputs.percent }}
          minColorRange: 50
          maxColorRange: 90
          # Off by default so an unchanged percentage leaves the gist, and its
          # revision history, alone.
          forceUpdate: ${{ inputs.force_badge || false }}
