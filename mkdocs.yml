site_name: modax
site_description: GPU-accelerated ODE solvers for massive ensembles of low-dimensional trajectories
site_url: https://lawrenceberry.github.io/modax/
repo_url: https://github.com/lawrenceberry/modax
repo_name: lawrenceberry/modax
edit_uri: edit/master/docs/
copyright: Copyright &copy; Lawrence Berry

# The long-form prose lives in README.md and the examples' own READMEs, which
# the pages under docs/ pull in section by section with pymdownx.snippets, so
# there is one copy of it. Those files are outside docs_dir, hence the watch
# list below and snippets' base_path.
watch:
  - README.md
  - wheels
  - examples
  - modax

theme:
  name: material
  icon:
    logo: material/chart-bell-curve-cumulative
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.action.edit
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - The numba-enzyme-cuda wheel: wheels/README.md
  - Guide:
      - Calling a solver: guide/api.md
      - Writing ODE callbacks: guide/callbacks.md
      - Sparse systems: guide/sparse.md
      - Gradients: guide/gradients.md
      - Kernel design: guide/kernel-design.md
  - Examples:
      - Overview: examples/index.md
      - BBN parameter estimation: examples/bbn-estimation.md
      - 21cm IGM evolution: examples/21cm-igm-evolution.md
      - Mukhanov-Sasaki modes: examples/mukhanov-sasaki.md
  - API reference:
      - Solvers: api/solvers.md
      - Internals: api/internals.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # Griffe reads the source statically, so building the docs needs
          # neither a GPU nor the CUDA toolchain the package imports.
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            heading_level: 2
            show_root_heading: true
            show_root_full_path: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            signature_crossrefs: true
            members_order: source
            filters: ["!^_[^_]"]
            merge_init_into_class: true
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.jax.dev/en/latest/objects.inv

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
